<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday L.O.M.L ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(135deg,#150019,#52002f,#150019);
color:white;
overflow-x:hidden;
text-align:center;
}

.container{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
max-width:700px;
padding:35px;
border-radius:30px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(10px);
box-shadow:0 0 40px rgba(255,255,255,.3);
}

h1{
font-size:40px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{
text-shadow:0 0 10px pink;
}
to{
text-shadow:0 0 30px gold;
}
}

#message{
margin-top:25px;
font-size:18px;
line-height:2;
white-space:pre-line;
}

iframe{
margin-top:25px;
border-radius:20px;
width:100%;
}

.heart{
position:fixed;
bottom:-50px;
font-size:30px;
animation:float 7s linear forwards;
}

@keyframes float{
from{
transform:translateY(0);
opacity:1;
}
to{
transform:translateY(-110vh);
opacity:0;
}
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>🎉 Happy Birthday L.O.M.L ❤️</h1>

<div id="message"></div>

<h2 style="margin-top:30px;">🎵 Our Song ❤️</h2>

<iframe
height="315"
src="https://www.youtube.com/embed/gfojC4Cs02E?rel=0"
title="Glow by Jah Vinci"
frameborder="0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>

</div>

</div>


<script>

const text=`Happy Birthday My Special Girl 🥳🎂❤️

Mi hope yuh day full a love laugh an nuff blessings

Mi thankful fi have yuh inna mi life an mi pray seh God guide yuh protect yuh an open nuff new door fi yuh dis year

Keep yuh smile bright keep being yuhself cause yuh one inna million

Mi wish yuh nuff happiness good health success an every likkle ting weh yuh heart desire

Enjoy yuh special day to di fullest

Big up yuhself ❤️🎉

Love Always

❤️ Tim ❤️`;

let i=0;

function typeMessage(){

if(i < text.length){

document.getElementById("message").innerHTML += text.charAt(i);

i++;

setTimeout(typeMessage,40);

}

}

typeMessage();


setInterval(()=>{

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*30)+"px";

document.body.appendChild(heart);


setTimeout(()=>{

heart.remove();

},7000);


},300);


</script>

</body>
</html>
